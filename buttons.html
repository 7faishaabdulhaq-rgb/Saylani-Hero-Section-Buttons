<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10 Buttons</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="CSS/buttons.css" type="text/css" />
  </head>
  <body>
    <h1>10 Different Buttons</h1>
    <div>
      <button id="home">
        <span><i class="fa-solid fa-house"></i></span>Home
      </button>
      <button id="success">
        <span><i class="fa-solid fa-check"></i></span>Success
      </button>
      <button id="download">
        <span><i class="fa-solid fa-download"></i></span>Download
      </button>
      <button id="explore">
        <span><i class="fa-solid fa-bolt"></i></span>Explore
      </button>
      <button id="favorite">
        <span><i class="fa-solid fa-heart"></i></span>Favorite
      </button>
      <button id="login">
        <span><i class="fa-solid fa-lock"></i></span>Login
      </button>
      <button id="send">
        <span><i class="fa-solid fa-paper-plane"></i></span>Send
      </button>
      <button id="rate-us">
        <span><i class="fa-solid fa-star"></i></span>Rate Us
      </button>
      <button id="shop-now">
        <span><i class="fa-solid fa-cart-shopping"></i></span>Shop Now
      </button>
      <button id="subscribe">Subscribe</button>
    </div>
  </body>
</html>
